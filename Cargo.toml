[package]
name = "dpds-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"
authors = ["Etienne Zink <etienne.zink@uni-tuebingen.de>"]
description = "Core of the DPDS network-link emulator."
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/uni-tue-kn/DPDS-Core"
keywords = ["network", "emulation", "dpdk", "packet", "latency"]
categories = ["network-programming", "simulation"]

[dependencies]
rand = "0.10.1"
rand_distr = "0.6.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"

[lib]
name = "dpds_core"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cbindgen = "0.29.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
